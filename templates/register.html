<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">
                    <h3>Registration</h3>
                </div>

                <div class="card-body">

                    <form action="/register" method="POST">

                        <div class="mb-3">
                            <label>Full Name</label>
                            <input
                                type="text"
                                class="form-control"
                                name="name"
                                >
                        </div>

                        <div class="mb-3">
                            <label>Gender</label>

                            <select class="form-select" name="gender" >

                                <option value="">Select Gender</option>

                                <option value="Male">
                                    Male
                                </option>

                                <option value="Female">
                                    Female
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>
<!-- 
                        <div class="mb-3">
                            <label>Age</label>

                            <input
                                type="number"
                                class="form-control"
                                name="age"
                                required>
                        </div> -->
                        <div class="mb-3">
                            <label>Class</label>
                            
                            <select class="form-select" name="major" >
                                 

                                <option value="">Select</option>

                                <option value="Web frontend">
                                    Web Frontend
                                </option>

                                <option value="Web Backend">
                                    Web Backend
                                </option>

                              

                            </select>
                        </div>

                        <div class="mb-3">
                            <label>Date of Birth</label>

                            <input
                                type="date"
                                class="form-control"
                                name="birth"
                                >
                        </div>

                        
                          <div class="mb-3">
                            <label>Phone Number</label>

                            <input
                                type="text"
                                class="form-control"
                                name="phone"
                                >
                        </div>
                          <div class="mb-3">
                            <label>Password</label>

                            <input
                                type="password"
                                class="form-control"
                                name="pwd"
                                >
                        </div>


                        <div>
                            <button class="btn btn-primary w-25 float-end" type="submit" >
                            Register
                        </button>
 
                      
                        </div>
                        
                        <div>
                           <div>
                      <a href="/admin" class="btn btn-secondary">
                        Back
                        </a>
                    </div>
                      
                        </div>

                        

                    </form>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
<script>

</script>
