<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}


body{
    background:#f1f5f9;
    padding:40px;
}


/* Main Box */

.result-container{

    width:95%;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);

}


/* Title */

h1{

    text-align:center;
    color:#0d6efd;
    margin-bottom:25px;

}



/* Table */

table{

    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:15px;

}



thead{

    background:linear-gradient(135deg,#0d6efd,#6610f2);
    color:white;

}


th{

    padding:15px;
    font-size:16px;

}



td{

    padding:14px;
    text-align:center;
    border-bottom:1px solid #ddd;

}



tbody tr:nth-child(even){
    background:#f8f9fa;
}

tbody tr:nth-child(odd){
    background:white;
}

tbody tr:hover{
    background:#dbeafe;
    transform:scale(1.01);
}



/* Grade */

.grade-A{

    color:white;
    background:#198754;
    padding:6px 15px;
    border-radius:20px;

}


.grade-B{

    color:white;
    background:#0d6efd;
    padding:6px 15px;
    border-radius:20px;

}


.grade-C{

    color:white;
    background:#ffc107;
    padding:6px 15px;
    border-radius:20px;

}


.grade-D{

    color:white;
    background:#fd7e14;
    padding:6px 15px;
    border-radius:20px;

}


.grade-F{

    color:white;
    background:#dc3545;
    padding:6px 15px;
    border-radius:20px;

}


/* Responsive */

@media(max-width:900px){

    table{

        font-size:12px;

    }

    th,td{

        padding:8px;

    }

}


</style>

</head>


<body>


<div class="result-container">


<h1>Student Result Report</h1>


<table>


<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>HTML</th>
<th>CSS</th>
<th>JavaScript</th>
<th>Bootstrap</th>
<th>Total</th>
<th>Average</th>
<th>Grade</th>

</tr>

</thead>




<tbody>
    {% for row  in result1 %}
    <tr>
        <td>{{row[0]}}</td>
        <td>{{row[1]}}</td>
        <td>{{row[2]}}</td>
        <td>{{row[3]}}</td>
        <td>{{row[4]}}</td>
        <td>{{row[5]}}</td>
        <td>{{row[6]}}</td>
        <td>{{row[7]}}</td>
        <td>{{row[8]}}</td>
    </tr>
    {%endfor%}
</tbody>
</table>
<div class="mt-3">
    <a href="/clas1" class="btn btn-secondary">Back</a>
</div>


</div>



</body>
</html>
