<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background: linear-gradient(135deg, #0d6efd, #6f42c1);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .login-box{
            background:white;
            padding:35px;
            border-radius:15px;
            width:380px;
            box-shadow:0 8px 20px rgba(0,0,0,.2);
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2 class="text-center mb-4">Teacher Login</h2>

    <form action="/teacher_login" method="POST">

        <div class="mb-3">
            <label class="form-label">Teacher ID</label>
            <input type="text" name="id" class="form-control" placeholder="Enter Teacher ID" >
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="pwd" class="form-control" placeholder="Enter Password" >
        </div>

        <button type="submit" class="btn btn-primary w-100" >Login</button>

        <!-- <a href="/" class="btn btn-secondary w-100 mt-2">Back</a> -->

    </form>
</div>


</body>
</html>
