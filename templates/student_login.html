<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .login-box{
            width:350px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .login-box h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            color:#555;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
            font-size:16px;
        }

        .input-box input:focus{
            border-color:#4facfe;
        }

        button{
            width:100%;
            padding:12px;
            background:#4facfe;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#008cff;
        }

        .register{
            text-align:center;
            margin-top:20px;
        }

        .register a{
            text-decoration:none;
            color:#008cff;
        }

    </style>
</head>

<body>

    <div class="login-box">

        <h2>Student Login</h2>

        <form action="/student_login" method="POST">

            <div class="input-box">
                <label>Student ID</label>
                <input type="text" name="id" placeholder="Enter Student ID">
            </div>


            <div class="input-box">
                <label>Password</label>
                <input type="password" name="pwd" placeholder="Enter Password">
            </div>


            <button type="submit">Login</button>

        </form>


        <!-- <div class="register">
            <p>Don't have account?
                <a href="/register">Register</a>
            </p>
        </div> -->

    </div>


</body>
</html>
