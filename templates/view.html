<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<body>
    <h1 class="text-center text-info text-md-center">Student List</h1>
    <form action="/search_student" method="GET" class="d-flex mb-3 container">
        <input type="number"
               name="id"
               class="form-control me-2"
               placeholder="Search Student by ID"
               required>

        <button type="submit" class="btn btn-primary">Search</button>

       
    </form>
<div class="container">
    <table class="table">
  <thead class=" text-danger">
    <tr >
    
      <th >ID</th>
      <th >Name</th>
      <th >Gender</th>
      <th >Birth</th>
      <th>Class</th>
      <th>Phone</th>
      <th>PassWord</th>
      <th>Action</th>
      <!-- <th>Action</th> -->
    </tr>
  </thead>
 <tbody>
{% for row in students %}
<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
    <td>{{ row[4] }}</td>
    <td>{{ row[5] }}</td>
    <td>{{row[6]}}</td>
   
    <td>
        <a href="/delete/{{ row[0] }}" class="btn btn-danger">
                Delete
            </a>
            

           
    </td>
</tr>
{% endfor %}
</tbody>
</table>
<a href="/admin" class="btn btn-primary float-none">Back</a>
  <!-- <a href="/score" class="btn-outline-danger"><button class="btn btn bg-success float-end">Add Score</button></a> -->

</div>
</body>
</html>
