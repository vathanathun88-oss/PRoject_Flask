<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .payment-card {
            width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .payment-card h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .btn-pay {
            width: 100%;
            border-radius: 25px;
            padding: 10px;
        }

        input, select {
            border-radius: 10px !important;
        }
    </style>

</head>

<body>


<div class="payment-card">

    <h2>Student Payment</h2>


    <form action="/payment" method="POST" enctype="multipart/form-data">


        <!-- Student ID -->
        <div class="mb-3">
            <label class="form-label">
                Student ID
            </label>

            <input 
                type="number" 
                class="form-control"
                name="id"
                placeholder="Enter Student ID">
        </div>


        <!-- Student Name -->
        <!-- <div class="mb-3">

            <label class="form-label">
                Student Name
            </label>

            <input 
                type="text"
                class="form-control"
                name="name"
                placeholder="Enter Name">

        </div> -->


        <!-- Major -->
        <div class="mb-3">

            <label class="form-label">
                Major
            </label>

            <select class="form-select" name="major_id">

                <option selected>
                    Choose Major
                </option>

                <option value="1">
                    Web Frontend
                </option>
                  <option value="2">
                    Web Backend
                </option>

                

            </select>

        </div>



        <!-- Amount -->
        <div class="mb-3">

            <label class="form-label">
                Amount
            </label>

            <input 
                type="number"
                class="form-control"
                name="amount"
                placeholder="$">

        </div>



       



        <!-- Upload Receipt -->
        <!-- <div class="mb-3">

            <label class="form-label">
                Upload Receipt
            </label>

            <input 
                type="file"
                class="form-control"
                name="receipt">

        </div> -->



   <div>
         <button class="btn btn-success btn-pay w-50 float-end">
            Pay Now
        </button>
        <a href="/admin" class="btn btn-primary rounded-5 w-25">Back</a>
   </div>


    </form>

</div>
 


</body>
</html>
