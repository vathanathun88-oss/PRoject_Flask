<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .class-header{
            background:#0d6efd;
            color:white;
            padding:20px;
            border-radius:12px;
            margin-bottom:20px;
        }

        .table-container{
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,.1);
        }
    </style>
</head>
<body>

<div class="container py-4">

    <!-- Class Information -->
    <div class="class-header">
        <h2 class="text-center">Backend Classroom</h2>
        <!-- <p class="mb-1"><strong>Teacher:</strong> Mr. Dara</p>
        <p class="mb-0"><strong>Teacher ID:</strong> T001</p> -->
    </div>

    <!-- Student Table -->
    <div class="table-container">
        <h4 class="mb-3">Student List</h4>

        <table class="table table-bordered table-hover text-center align-middle">
            <thead class="table-primary">
                         <tr >
    
      <th >ID</th>
      <th >Name</th>
      <th >Gender</th>
      <th >Birth</th>
      <th>Phone</th>
      <th>Class</th>
      <th>Action</th>
      <!-- <th>Action</th> -->
    </tr>
            </thead>

            <tbody>
     {% for row in student %}
<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
    <td>{{ row[4] }}</td>
    <td>{{ row[5] }}</td>
    
   
    <td>
        <a href="/score_backend/{{row[0]}}" class="btn btn-danger">
                Score
            </a>
            

           
    </td>
</tr>
{% endfor %}
            </tbody>
        </table>

        <div class="text-end">
            <a href="/" class="btn btn-secondary">Logout</a>
              <a href="/result2" class="btn btn-success">
                Result
            </a>
        </div>

    </div>


</div>

</body>
</html>
