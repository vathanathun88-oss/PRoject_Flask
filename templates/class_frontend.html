<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Classroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

body{
    background:#f4f6f9;
}


/* Header */

.class-header{
    background:#0d6efd;
    color:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}


/* Table box */

.table-container{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}


/* Button smooth */

.btn{
    transition:0.3s;
}


.btn:hover{
    transform:translateY(-3px);
}



/* Table hover */

tbody tr:hover{
    background:#f1f5ff;
}



/* Tablet */

@media(max-width:992px){

    .container{
        width:95%;
    }


    table{
        font-size:14px;
    }


    .class-header h2{
        font-size:28px;
    }

}



/* Mobile */

@media(max-width:768px){


    .class-header{
        padding:15px;
    }


    .class-header h2{
        font-size:22px;
    }


    .table-container{
        padding:15px;
    }


    /* Make table scroll horizontally */
    .table-container{
        overflow-x:auto;
    }


    table{
        min-width:700px;
    }


    .btn{
        font-size:14px;
    }


}



/* Small phone */

@media(max-width:576px){


    .container{
        padding:10px;
    }


    h4{
        font-size:18px;
    }


    .text-end{
        text-align:center !important;
    }


    .text-end .btn{

        width:100%;
        margin-top:10px;

    }


}

</style>

</head>

<body>

<div class="container py-4">

    <div class="class-header">
        <h2 class="text-center">Frontend Classroom</h2>
    
    </div>


    <div class="table-container">

        <h4 class="mb-3">Student List</h4>

        <table class="table table-bordered table-hover text-center align-middle">

            <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Birth</th>
                    <th>Phone</th>
                    <th>Class</th>
                    <th>Action</th>
                </tr>
            </thead>


            <tbody>

            {% for row in students %}

            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
                <td>{{ row[3] }}</td>
                <td>{{ row[4] }}</td>
                <td>{{ row[5] }}</td>

                <td>
                    <a href="/score_frontend/{{ row[0] }}" class="btn btn-danger">
                        Score
                    </a>
                </td>

            </tr>

            {% endfor %}

            </tbody>

        </table>


        <div class="text-end">
            <a href="/" class="btn btn-secondary">
                Logout
            </a>
             <a href="/result1" class="btn btn-success">
                Result
            </a>
        </div>
      

    </div>


</div>

</body>
</html>
