<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

/* Table header */
thead {
    background-color: #212529;
    color: white;
}

th, td {
    padding: 12px;
    text-align: center;
    border: 1px solid #ddd;
}

/* Even row */
tbody tr:nth-child(even) {
    background-color: #f8f9fa;
}

/* Hover effect */
tbody tr:hover {
    background-color: #e9ecef;
}


/* Status column (7th column) */
tbody tr td:nth-child(7) {
    font-weight: bold;
    border-radius: 10px;
}


/* Paid status */
.status-paid {
    background-color: green;
    color: white;
    padding: 6px 15px;
    border-radius: 20px;
}


/* Pending status */
.status-pending {
    background-color: orange;
    color: white;
    padding: 6px 15px;
    border-radius: 20px;
}
</style>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Student Payment</h2>

    <table class="table table-bordered table-hover text-center">

        <thead class="table-dark">
            <tr>
                <th>Payment ID</th>
                <th>Student ID</th>
                <th>Student Name </th>
                <th>Major</th>
                <th>Amount</th>
                <th>Payment Date</th>
                <th>Staus</th>
                
                
            </tr>
        </thead>


        <tbody>
            {% for  row  in pay%}
            <tr>
                <td>{{row[0]}}</td>
                <td>{{row[1]}}</td>
                <td>{{row[2]}}</td>
                <td>{{row[3]}}</td>
                <td>{{row[4]}}</td>
                <td>{{row[5]}}</td>
                <td>{{row[6]}}</td>
            </tr>
            {% endfor %}
        </tbody>
    

    </table>
    <a href="/admin" class="btn btn-info">Back</a>


</div>

</body>
</html>
