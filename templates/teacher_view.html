<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Information</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">


<h1 class="text-center text-primary mb-4">
    Teacher Information
</h1>


<div class="card shadow">


<div class="card-header bg-primary text-white">
    <h3>Teacher List</h3>
</div>


<div class="card-body">


<table class="table table-bordered table-hover text-center">


<thead class="table-dark">

<tr>

<th> ID</th>
<th> Name</th>
<th>Gender</th>
<th>Phone</th>
<th>Birth</th>
<th>Email</th>
<th>Class</th>

</tr>

</thead>



<tbody>
   {% for row in techer %}
<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
    <td>{{ row[4] }}</td>
    <td>{{ row[5] }}</td>
    <td>{{ row[6] }}</td>
</tr>
  {% endfor%}
</tbody>

</table>
<a href="/admin" class="btn btn-danger float-none">Back</a>
</div>


</div>


</div>


</body>

</html>
