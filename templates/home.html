<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Control System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#667eea,#764ba2);
            height:100vh;
        }


        /* Navigation Bar */
        nav{
            width:100%;
            padding:20px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:white;
        }

        .logo{
            font-size:25px;
            font-weight:bold;
            color:#667eea;
        }


        ul{
            display:flex;
            list-style:none;
            gap:30px;
        }


        ul li a{
            text-decoration:none;
            color:#333;
            font-size:17px;
        }


        ul li a:hover{
            color:#667eea;
        }


        .login-btn{
            background:#667eea;
            color:white !important;
            padding:10px 25px;
            border-radius:20px;
        }


        /* Home Content */

        .home{
            height:80vh;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            color:white;
        }


        .content h1{
            font-size:45px;
            margin-bottom:20px;
        }


        .content p{
            font-size:20px;
            margin-bottom:30px;
        }


        /* .start-btn{
            background:white;
            color:#667eea;
            padding:15px 40px;
            border-radius:30px;
            text-decoration:none;
            font-size:18px;
            font-weight:bold;
        } */


        .start-btn:hover{
            background:#eee;
        }


    </style>

</head>


<body>


    <nav>

        <div class="logo">
            Student System
        </div>


        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="#">Contact</a></li>
            <li><a class="login-btn" href="/admin_login">Admin Login</a></li>
        </ul>


    </nav>



    <section class="home">

        <div class="content">

            <h1>Welcome to Student Control System</h1>

            <p>
                Manage student information, results and payments easily.
            </p>


            <a   href="/student_login" class="btn btn-primary rounded-pill">
                Student Login
            </a>
            <a href="/teacher_login" class="btn btn-success rounded-pill" >
        Teacher Login
    </a>


        </div>


    </section>


</body>
</html>
